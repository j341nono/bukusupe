<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./icons/icon128.png" />
    <title>ブクスペ</title>
    <style>
      :root {
        color-scheme: dark;
        /* 星図のパレット：藍（夜）・白（星と文字）・金（人が名付けたもの＝星座）の 3 系統 */
        --night: #070a18;
        --ink: #ece6d6;
        --dim: #a29d8c;
        --faint: rgba(214, 205, 180, 0.2);
        --hairline: rgba(214, 205, 180, 0.28);
        --gold: #d8b878;
        --gold-soft: rgba(216, 184, 120, 0.6);
        /* 名前（星団・星座）は明朝、記録（タイトル・画面の部品）はゴシック */
        --font-name: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
        --font-text: "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", "Noto Sans JP", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--night);
        color: var(--ink);
        font-family: var(--font-text);
        overflow: hidden;
      }
      #space {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
      }
      #space:active { cursor: grabbing; }
      /* 周辺減光：四隅をわずかに沈め、中央の星図に目が向くようにする */
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 75% 70% at 50% 48%, transparent 55%, rgba(2, 3, 10, 0.55) 100%),
          linear-gradient(180deg, rgba(40, 52, 96, 0.10), transparent 45%);
      }

      #hud-toggle {
        position: fixed;
        top: 20px;
        left: 22px;
        width: 26px;
        height: 26px;
        padding: 0;
        font: inherit;
        font-size: 13px;
        line-height: 1;
        color: var(--dim);
        background: rgba(7, 10, 24, 0.5);
        border: 1px solid var(--faint);
        border-radius: 50%;
        cursor: pointer;
      }
      #hud-toggle:hover { color: var(--ink); border-color: var(--hairline); }

      #hud {
        position: fixed;
        top: 56px;
        left: 22px;
        max-width: 300px;
        padding: 14px 18px;
        border: 1px solid var(--faint);
        border-radius: 6px;
        background: rgba(7, 10, 24, 0.82);
        font-size: 13px;
        line-height: 1.8;
        letter-spacing: 0.02em;
        pointer-events: none;
      }
      .hud-title {
        font-family: var(--font-name);
        font-size: 16px;
        letter-spacing: 0.3em;
        margin-bottom: 4px;
      }
      .hud-help {
        margin: 10px 0 0;
        padding: 10px 0 0;
        border-top: 1px solid var(--faint);
        font-size: 11.5px;
        line-height: 1.75;
        color: var(--dim);
        list-style: none;
      }
      .hud-help kbd {
        display: inline-block;
        min-width: 1.5em;
        padding: 0 4px;
        border: 1px solid var(--hairline);
        border-radius: 3px;
        font: inherit;
        font-size: 10.5px;
        line-height: 1.5;
        text-align: center;
        color: var(--ink);
      }
      .hud-line { color: var(--ink); }
      .hud-switch, #sample-hint button {
        pointer-events: auto;
        padding: 3px 12px;
        border: 1px solid var(--hairline);
        border-radius: 999px;
        background: none;
        color: var(--ink);
        font: inherit;
        font-size: 11.5px;
        letter-spacing: 0.06em;
        cursor: pointer;
      }
      .hud-switch { margin-top: 10px; }
      .hud-switch:hover, #sample-hint button:hover { border-color: rgba(214, 205, 180, 0.6); }
      /* ブックマークが少ないときの案内（初回だけ。控えめに左下） */
      #sample-hint {
        position: fixed;
        left: 22px;
        bottom: 56px;
        z-index: 3;
        max-width: min(360px, calc(100vw - 44px));
        padding: 10px 14px;
        border: 1px solid var(--faint);
        border-radius: 6px;
        background: rgba(7, 10, 24, 0.82);
        color: var(--dim);
        font-size: 12px;
        line-height: 1.7;
      }
      #sample-hint[hidden] { display: none; }
      #sample-hint .sample-hint-actions { margin-top: 6px; display: flex; gap: 8px; }
      #sample-hint #sample-hint-close { border-color: transparent; color: var(--dim); }
      body.is-flying #sample-hint { display: none; }
      .hud-key {
        display: inline-block;
        min-width: 4.8em;
        color: var(--dim);
      }
      .hud-status {
        margin-top: 6px;
        color: var(--dim);
        font-size: 12px;
      }
      .hud-bar {
        margin-top: 6px;
        height: 2px;
        width: 168px;
        background: var(--faint);
        border-radius: 1px;
        overflow: hidden;
      }
      .hud-bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, rgba(236, 230, 214, 0.4), var(--ink));
        transition: width 0.25s ease-out;
      }

      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .label {
        position: absolute;
        top: 0;
        left: 0;
        will-change: transform, opacity;
        transition: opacity 180ms ease;
        padding: 3px 5px;
        white-space: nowrap;
        pointer-events: none;
        /* 箱の代わりに、何重かの暗い光輪で星の上でも読めるようにする */
        text-shadow: 0 0 2px rgba(4, 6, 16, 1), 0 0 4px rgba(4, 6, 16, 1), 0 0 10px rgba(4, 6, 16, 0.8);
      }
      /* 星団名：星図の見出し。明朝・広い字間・生成り色。大きさは星団の件数で 13〜17px */
      .label-cluster {
        font-family: var(--font-name);
        font-size: 13px;
        letter-spacing: 0.28em;
        color: rgba(234, 224, 198, 0.9);
      }
      .label-cluster-focus { cursor: pointer; }
      .label-cluster-focus:hover { color: #fff8e6; text-decoration: underline; text-underline-offset: 4px;
        text-decoration-color: var(--hairline); }
      /* 星のタイトル：記録。ゴシックのまま、暖かい灰白で */
      .label-star {
        font-size: 11px;
        letter-spacing: 0.02em;
        color: rgba(226, 220, 204, 0.8);
        cursor: pointer;
      }
      /* 星からタイトルへの引き出し線（右側は左端に、左側は右端に） */
      .label-star::before, .label-star[data-side="left"]::after {
        content: "";
        display: inline-block;
        width: 7px;
        height: 1px;
        margin-right: 4px;
        background: rgba(226, 220, 204, 0.45);
        vertical-align: 0.3em;
      }
      .label-star[data-side="left"]::before { display: none; }
      .label-star[data-side="left"]::after { margin: 0 0 0 4px; }
      .label-orbit-inner { font-size: 14px; color: rgba(246, 241, 228, 0.98); }
      .label-orbit-middle { font-size: 12px; color: rgba(232, 226, 210, 0.86); }
      .label-orbit-outer { font-size: 10px; color: rgba(200, 194, 178, 0.66); }
      .label-orbit-outer:hover { color: rgba(246, 241, 228, 0.98); }
      .label-orbit-outer.is-hovered { color: rgba(246, 241, 228, 0.98); }

      #relayout {
        position: fixed;
        right: 20px;
        bottom: 18px;
        padding: 6px 4px;
        font: inherit;
        font-size: 11.5px;
        letter-spacing: 0.08em;
        color: var(--dim);
        background: none;
        border: none;
        border-bottom: 1px solid transparent;
        cursor: pointer;
      }
      #relayout:hover {
        color: var(--ink);
        border-bottom-color: var(--hairline);
      }

      /* 飛行モード：入り口のボタン（「再配置」の左）と、飛行中の操作の説明 */
      #flight-toggle {
        position: fixed; right: 92px; bottom: 16px; z-index: 5;
        padding: 6px 16px; border: 1px solid var(--hairline); border-radius: 999px;
        background: rgba(7, 10, 24, 0.7); color: var(--ink); cursor: pointer;
        font: inherit; font-size: 12px; letter-spacing: 0.16em;
      }
      #flight-toggle:hover { border-color: rgba(214, 205, 180, 0.6); }
      /* 飛行中の操作の説明（初見で 10 秒以内に飛べるよう、飛んでいる間はずっと出しておく） */
      #flight-help {
        display: none; position: fixed; left: 50%; bottom: 18px; z-index: 5; transform: translateX(-50%);
        padding: 9px 18px 8px; border: 1px solid var(--faint); border-radius: 8px;
        background: rgba(7, 10, 24, 0.72); color: var(--ink); font-size: 12px; letter-spacing: 0.04em;
        text-align: center; white-space: nowrap; pointer-events: none;
      }
      #flight-help span { margin: 0 9px; }
      #flight-help p { margin: 5px 0 0; font-size: 11px; color: var(--dim); }
      #flight-help kbd {
        display: inline-block; min-width: 1.6em; margin: 0 2px; padding: 0 5px;
        border: 1px solid var(--hairline); border-radius: 3px; font: inherit; font-size: 11px; line-height: 1.6;
      }
      body.is-flying #flight-help { display: block; }
      #flight-help { transition: opacity 0.9s ease; }
      /* 入って約 10 秒後：左下の小さな 1 行に。窓や星に重ならないように */
      #flight-help.is-compact {
        left: 16px; bottom: 14px; transform: none; padding: 4px 10px; font-size: 10.5px; opacity: 0.5;
        border-color: transparent; background: rgba(7, 10, 24, 0.45);
      }
      #flight-help.is-compact span { margin: 0 5px; }
      #flight-help.is-compact kbd { font-size: 9.5px; line-height: 1.4; padding: 0 3px; }
      #flight-help.is-compact p { display: none; }
      /* 近づいた星の窓：アイコン・タイトル・ドメイン（位置は毎コマ transform で動かす） */
      #flight-windows { position: fixed; inset: 0; pointer-events: none; overflow: hidden; display: none; }
      #flight-far-labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; display: none; }
      body.is-flying #flight-far-labels { display: block; }
      .flight-far-label {
        position: absolute; top: 0; left: 0; max-width: 180px; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; font: 10px var(--font-text); letter-spacing: 0.03em;
        color: rgba(219, 226, 241, 0.53); text-shadow: 0 0 5px #070a18;
        will-change: transform; pointer-events: none;
      }
      /* 飛行中の星団名：遠くからも標識のように。明朝・広い字間（近づくと薄くなる） */
      #flight-signs { position: fixed; inset: 0; pointer-events: none; overflow: hidden; display: none; }
      body.is-flying #flight-signs { display: block; }
      body.is-flying.flight-boost::after {
        content: ""; position: fixed; inset: 0; z-index: 3; pointer-events: none;
        background: repeating-conic-gradient(from 0deg at 50% 50%, transparent 0deg 9deg, rgba(212, 226, 244, 0.16) 9.2deg 9.5deg, transparent 9.8deg 18deg);
        mask-image: radial-gradient(circle, transparent 0 20%, #000 85%);
        animation: boost-streak 450ms linear infinite;
      }
      @keyframes boost-streak { from { opacity: 0.2; transform: scale(0.8); } to { opacity: 0.65; transform: scale(1.2); } }
      .flight-sign {
        position: absolute; top: 0; left: 0; white-space: nowrap; will-change: transform, opacity;
        font-family: var(--font-name); font-size: 15px; letter-spacing: 0.3em; color: rgba(234, 224, 198, 0.95);
        text-shadow: 0 0 3px rgba(4, 6, 16, 1), 0 0 10px rgba(4, 6, 16, 0.8);
      }
      /* 星に入る瞬間の、淡い光（白に近いクリーム。中心から満ちる） */
      #flight-flash {
        position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 4;
        background: radial-gradient(circle at 50% 45%, rgba(255, 250, 236, 0.95), rgba(236, 230, 214, 0.35) 45%, rgba(7, 10, 24, 0) 75%);
      }
      body.is-flying #flight-windows { display: block; }
      .flight-window {
        position: absolute; top: 0; left: 0; display: flex; gap: 8px; align-items: center;
        max-width: 280px; padding: 6px 10px 6px 8px; border: 1px solid var(--faint); border-radius: 6px;
        background: rgba(7, 10, 24, 0.78); will-change: transform, opacity; transition: opacity 160ms ease;
      }
      .flight-window img { flex: none; width: 16px; height: 16px; border-radius: 3px; }
      /* サイトのアイコンが無いときの、頭文字の紋章（ドメインから決めた淡い色合いの小さな円） */
      .flight-window-crest {
        flex: none; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%;
        color: #1c2342; font-family: var(--font-name); font-size: 10.5px; font-weight: 600; line-height: 1;
      }
      .flight-window-title { font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px; }
      .flight-window-domain { font-size: 10.5px; color: var(--dim); letter-spacing: 0.04em; }
      body.is-flying #flight-toggle { right: 20px; }
      /* 飛行中は地図の部品を隠す（入る前の状態は保ったまま。出たら戻る） */
      body.is-flying #search-box, body.is-flying #constellation-list, body.is-flying #constellation-manage, body.is-flying #constellation-novae,
      body.is-flying #star-card, body.is-flying #hint, body.is-flying #relayout, body.is-flying #labels,
      body.is-flying #constellation-name { display: none !important; }

      #hint {
        position: fixed;
        bottom: 18px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11.5px;
        letter-spacing: 0.06em;
        color: var(--dim);
        pointer-events: none;
        transition: opacity 1.6s ease;
      }
      /* 操作の説明は最初の約 10 秒だけ。全文は ⓘ の中にある */
      #hint.is-faded { opacity: 0; }
      body.has-constellations #hint { display: none; }
      #search-box {
        position: fixed;
        z-index: 4;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        width: min(440px, calc(100vw - 48px));
      }
      #search-input {
        width: 100%;
        padding: 11px 18px;
        border: 1px solid var(--hairline);
        border-radius: 22px;
        outline: none;
        background: rgba(7, 10, 24, 0.78);
        color: var(--ink);
        font: inherit;
        letter-spacing: 0.04em;
      }
      #search-input:focus { border-color: rgba(214, 205, 180, 0.55); }
      /* Web のデモ：モデルを裏で読み込んでいる間の、控えめな知らせ */
      #model-status {
        margin: 6px 18px 0;
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--dim);
        opacity: 0.8;
      }
      #model-status[hidden] { display: none; }
      #search-input::placeholder { color: var(--dim); letter-spacing: 0.2em; }
      #constellation-rename, #constellation-delete {
        padding: 6px 10px; border: none; border-radius: 4px; background: none; cursor: pointer; text-align: left;
        font: inherit; font-size: 12px; letter-spacing: 0.06em; color: var(--ink);
      }
      #constellation-rename:hover, #constellation-delete:hover { background: rgba(214, 205, 180, 0.1); }
      #constellation-delete { color: #d9a39a; }
      #constellation-create, #constellation-save, #constellation-cancel {
        padding: 6px 14px;
        border: 1px solid var(--gold-soft);
        border-radius: 999px;
        background: rgba(7, 10, 24, 0.85);
        color: #f0dcb0;
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      #constellation-create { display: block; margin: 9px auto 0; }
      #constellation-editor {
        margin-top: 9px;
        padding: 11px;
        border: 1px solid rgba(216, 184, 120, 0.3);
        border-radius: 8px;
        background: rgba(7, 10, 24, 0.94);
      }
      #constellation-editor p { margin: 0 0 9px; font-size: 11px; color: var(--dim); }
      #constellation-name-input {
        width: 100%; padding: 8px 10px; margin-bottom: 9px;
        border: 1px solid var(--hairline); border-radius: 5px;
        outline: none; background: #0a0e20; color: var(--ink);
        font-family: var(--font-name); font-size: 15px; letter-spacing: 0.12em;
      }
      .constellation-actions { display: flex; gap: 8px; }
      #constellation-list {
        position: fixed; z-index: 4; bottom: 14px; left: 50%;
        transform: translateX(-50%); display: flex; gap: 18px; align-items: baseline;
        max-width: calc(100vw - 200px); overflow-x: auto; white-space: nowrap;
        padding: 4px 6px;
      }
      #constellation-list > button {
        padding: 4px 2px; border: none; border-bottom: 1px solid transparent;
        color: rgba(234, 214, 170, 0.62); background: none; cursor: pointer;
        font-family: var(--font-name); font-size: 13.5px; letter-spacing: 0.18em;
        text-shadow: 0 0 6px rgba(4, 6, 16, 0.95);
      }
      #constellation-list > button:hover { color: #f0dcb0; }
      /* 長い星座の名前は「…」で省略する（全文は title） */
      #constellation-list > button { max-width: 16em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #constellation-list > button.is-active { color: #f4e2b8; border-bottom-color: var(--gold); }
      /* 選んでいる星座の横の「…」。押すと小さなメニュー（名前を変える／削除）が開く */
      #constellation-more {
        margin-left: -12px; padding: 2px 6px; border: none; border-radius: 4px; background: none; cursor: pointer;
        color: var(--dim); font: inherit; font-size: 14px; line-height: 1; letter-spacing: 0.1em;
      }
      #constellation-more:hover, #constellation-more[aria-expanded="true"] { color: var(--ink); background: rgba(214, 205, 180, 0.08); }
      #constellation-manage {
        position: fixed; z-index: 6; display: flex; flex-direction: column; gap: 2px;
        min-width: 116px; padding: 6px; border: 1px solid var(--faint); border-radius: 6px;
        background: rgba(7, 10, 24, 0.96);
      }
      #constellation-manage[hidden] { display: none; }
      /* 新星の一覧（SPEC 9 章）：選んでいる星座の、保存の後に加わって検索語に合う星。画面下の星座の名前の上に控えめに出す */
      #constellation-novae {
        position: fixed; z-index: 4; bottom: 52px; left: 50%; transform: translateX(-50%);
        width: min(440px, calc(100vw - 32px)); max-height: 34vh; overflow-y: auto;
        padding: 9px 12px 10px; border: 1px solid var(--faint); border-radius: 8px;
        background: rgba(7, 10, 24, 0.9);
      }
      #constellation-novae p {
        margin: 0 0 6px; font-size: 11px; letter-spacing: 0.06em; color: var(--dim);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      #constellation-novae p b { font-family: var(--font-name); font-weight: normal; letter-spacing: 0.18em; color: var(--ink); margin-right: 8px; }
      #constellation-novae ul { margin: 0; padding: 0; list-style: none; }
      #constellation-novae li { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px solid rgba(214, 205, 180, 0.08); }
      #constellation-novae li:first-child { border-top: none; }
      #constellation-novae .nova-title {
        flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; unicode-bidi: isolate;
      }
      #constellation-novae .nova-title::before { content: "✧ "; color: var(--ink); opacity: 0.8; }
      #constellation-novae button {
        flex: none; padding: 3px 10px; border-radius: 999px; background: none; cursor: pointer;
        font: inherit; font-size: 11.5px; letter-spacing: 0.08em;
      }
      /* 「加える」は星座（人が名付けたもの）への操作なので金。「見送る」は控えめ */
      #constellation-novae button[data-action="accept"] { border: 1px solid var(--gold-soft); color: #f0dcb0; }
      #constellation-novae button[data-action="dismiss"] { border: 1px solid var(--faint); color: var(--dim); }
      #constellation-novae button:hover { background: rgba(214, 205, 180, 0.08); }
      #constellation-name {
        position: fixed; z-index: 3; left: 0; top: 0; pointer-events: none;
        color: #f2dcaa; font-family: var(--font-name); font-size: 19px; letter-spacing: 0.32em;
        white-space: nowrap; text-shadow: 0 0 10px rgba(4, 6, 16, 0.95), 0 0 18px rgba(216, 184, 120, 0.25);
        opacity: 0; transition: opacity 600ms ease; will-change: transform, opacity;
        max-width: min(70vw, 640px); overflow: hidden; text-overflow: ellipsis;
      }
      #constellation-name.is-visible { opacity: 1; }
      [hidden] { display: none !important; }
      #star-card {
        position: fixed;
        z-index: 5;
        right: 20px;
        bottom: 60px;
        width: min(330px, calc(100vw - 40px));
        padding: 16px 18px;
        border: 1px solid var(--faint);
        border-radius: 6px;
        background: rgba(7, 10, 24, 0.95);
      }
      #star-card[hidden] { display: none; }
      #star-card-title { font-size: 14px; font-weight: 600; }
      #star-card-url, #star-card-folder { margin-top: 7px; color: var(--dim); font-size: 11px; overflow-wrap: anywhere; }
      /* 長いタイトル・フォルダ名・URL は行数を限って「…」で省略する（全文はマウスを乗せたときの title で見られる）。
         URL は先頭（ドメイン）が必ず見えるよう、左から右の向きに固定する（docs/SECURITY.md） */
      #star-card-title, #star-card-folder, #star-card-url {
        display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
      }
      #star-card-title { -webkit-line-clamp: 3; }
      #star-card-folder { -webkit-line-clamp: 2; }
      #star-card-url { -webkit-line-clamp: 3; direction: ltr; text-align: left; }
      /* ページやブックマークから来た文字列（タイトル・フォルダ名・星座の名前）を表示する要素は、書字の向きを周りと区切る。
         右から左へ書く制御文字が、周りの文字や記号の並びを入れ替えないように（docs/SECURITY.md） */
      .label, .flight-window-title, .flight-window-domain, .flight-far-label, .flight-sign,
      #star-card-title, #star-card-folder, #star-card-url, #constellation-name, #constellation-list > button {
        unicode-bidi: isolate;
      }
      #star-card-open { margin-top: 13px; padding: 6px 16px; border: 1px solid var(--hairline); border-radius: 999px;
        background: none; color: var(--ink); font: inherit; font-size: 12px; letter-spacing: 0.1em; cursor: pointer; }
      #star-card-open:hover { border-color: rgba(214, 205, 180, 0.6); }

      #hud.is-collapsed { display: none; }

      /* タッチの端末（スマホ）：地図と検索はタッチで使う。飛行モードはキーボードとマウスが要るので、ボタンを隠して案内だけ出す */
      .for-touch, #touch-note { display: none; }
      @media (hover: none) and (pointer: coarse) {
        .for-pointer { display: none; }
        .for-touch { display: inline; }
        #flight-toggle, #flight-help { display: none !important; }
        #touch-note {
          display: block;
          position: fixed;
          left: 16px;
          bottom: 18px;
          font-size: 11px;
          letter-spacing: 0.06em;
          color: var(--dim);
          opacity: 0.8;
          pointer-events: none;
        }
        #search-box { width: calc(100vw - 112px); }
        /* 下端は左に案内、右に「再配置」。操作の説明はその一段上に */
        #hint { bottom: 48px; padding: 0 16px; }
      }
      body.is-demo #hud,
      body.is-demo #hud-toggle { display: none; }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 13px;
        letter-spacing: 0.2em;
        color: var(--dim);
        pointer-events: none;
      }
    </style>
    <script type="module" crossorigin src="./index.js"></script>
  </head>
  <body>
    <canvas id="space"></canvas>
    <div id="vignette"></div>
    <div id="labels"></div>
    <div id="flight-signs"></div>
    <div id="flight-far-labels"></div>
    <div id="flight-windows"></div>
    <div id="flight-flash"></div>
    <div id="search-box">
      <input id="search-input" type="search" autocomplete="off" maxlength="200" placeholder="星を探す" aria-label="ブックマークを検索" />
      <div id="model-status" hidden>意味の検索を準備している（それまでは文字の一致で探す）</div>
      <button id="constellation-create" hidden>星座にする</button>
      <div id="constellation-editor" hidden>
        <p>星をクリックして加える・外す</p>
        <input id="constellation-name-input" aria-label="星座の名前" maxlength="80" />
        <div class="constellation-actions"><button id="constellation-save">保存</button><button id="constellation-cancel">やめる</button></div>
      </div>
    </div>
    <div id="constellation-name"></div>
    <section id="constellation-novae" aria-label="新星" hidden></section>
    <nav id="constellation-list" aria-label="保存した星座"></nav>
    <div id="constellation-manage" role="menu" aria-label="星座の操作" hidden><button id="constellation-rename" role="menuitem">名前を変える</button><button id="constellation-delete" role="menuitem">削除</button></div>
    <aside id="star-card" hidden>
      <div id="star-card-title"></div>
      <div id="star-card-url" dir="ltr"></div>
      <div id="star-card-folder"></div>
      <button id="star-card-open">開く</button>
    </aside>
    <button id="hud-toggle" title="情報を開閉する" aria-label="情報">ⓘ</button>
    <div id="hud"></div>
    <button id="relayout" title="星団から並べ直す">再配置</button>
    <button id="flight-toggle" title="星の間を飛ぶ（F）">飛行</button>
    <div id="flight-help" aria-live="polite">
      <span><kbd>W</kbd> 加速 <kbd>S</kbd> 減速</span>
      <span><kbd>A</kbd><kbd>D</kbd> 旋回</span>
      <span>マウス 機首の向き</span>
      <span><kbd>Space</kbd> 上昇 <kbd>Shift</kbd> 下降</span>
      <span><kbd>Esc</kbd> 地図へ戻る</span>
      <p>星に近づくと名前が見え、星の芯に入るとそのページが開く</p>
    </div>
    <div id="sample-hint" hidden>
      ブックマークが少ないので、星空がまだまばらです。156 個の星が並ぶサンプルの宇宙でも試せます（ⓘ からいつでも切り替えられます）。
      <div class="sample-hint-actions"><button id="sample-hint-try" type="button">サンプルの宇宙で試す</button><button id="sample-hint-close" type="button">閉じる</button></div>
    </div>
    <div id="loading">星を数えている…</div>
    <div id="hint"><span class="for-pointer">ドラッグで移動・ホイールで拡大縮小　操作の一覧は ⓘ</span><span class="for-touch">ドラッグで移動・ピンチで拡大縮小・タップで選ぶ</span></div>
    <div id="touch-note">飛行モードは PC で試せます</div>
  </body>
</html>
