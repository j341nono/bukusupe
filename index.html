<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ブクスペ</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8ecff;
        --dim: #8f9ac4;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #05060f;
        color: var(--ink);
        font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
        overflow: hidden;
      }
      #space {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
      }
      #space:active { cursor: grabbing; }

      #hud {
        position: fixed;
        top: 20px;
        left: 22px;
        padding: 14px 18px;
        border: 1px solid rgba(150, 170, 255, 0.16);
        border-radius: 12px;
        background: rgba(8, 10, 26, 0.55);
        backdrop-filter: blur(8px);
        font-size: 13px;
        line-height: 1.8;
        letter-spacing: 0.02em;
        pointer-events: none;
      }
      .hud-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.22em;
        margin-bottom: 4px;
      }
      .hud-line { color: var(--ink); }
      .hud-key {
        display: inline-block;
        min-width: 4.8em;
        color: var(--dim);
      }

      #hint {
        position: fixed;
        bottom: 18px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 12px;
        color: var(--dim);
        pointer-events: none;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 13px;
        letter-spacing: 0.2em;
        color: var(--dim);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="space"></canvas>
    <div id="hud"></div>
    <div id="loading">星を数えている…</div>
    <div id="hint">ドラッグで移動・ホイールで拡大縮小（回転はしない）</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
