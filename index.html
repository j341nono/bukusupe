<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./icons/icon128.png" />
    <title>ブクスペ</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8ecff;
        --dim: #8f9ac4;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #05060f;
        color: var(--ink);
        font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
        overflow: hidden;
      }
      #space {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
      }
      #space:active { cursor: grabbing; }

      #hud {
        position: fixed;
        top: 20px;
        left: 22px;
        padding: 14px 18px;
        border: 1px solid rgba(150, 170, 255, 0.16);
        border-radius: 12px;
        background: rgba(8, 10, 26, 0.55);
        backdrop-filter: blur(8px);
        font-size: 13px;
        line-height: 1.8;
        letter-spacing: 0.02em;
        pointer-events: none;
      }
      .hud-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.22em;
        margin-bottom: 4px;
      }
      .hud-line { color: var(--ink); }
      .hud-key {
        display: inline-block;
        min-width: 4.8em;
        color: var(--dim);
      }
      .hud-status {
        margin-top: 6px;
        color: var(--dim);
        font-size: 12px;
      }
      .hud-bar {
        margin-top: 6px;
        height: 2px;
        width: 168px;
        background: rgba(150, 170, 255, 0.16);
        border-radius: 1px;
        overflow: hidden;
      }
      .hud-bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #7f9bff, #dfe7ff);
        transition: width 0.25s ease-out;
      }

      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .label {
        position: absolute;
        top: 0;
        left: 0;
        white-space: nowrap;
        pointer-events: none;
        text-shadow:
          0 0 3px rgba(2, 3, 9, 1), 0 0 6px rgba(2, 3, 9, 0.95),
          1px 1px 0 rgba(2, 3, 9, 0.9), -1px -1px 0 rgba(2, 3, 9, 0.9),
          1px -1px 0 rgba(2, 3, 9, 0.9), -1px 1px 0 rgba(2, 3, 9, 0.9);
      }
      .label-cluster {
        font-size: 13px;
        letter-spacing: 0.12em;
        color: rgba(222, 230, 255, 0.92);
      }
      .label-star {
        font-size: 11px;
        letter-spacing: 0.02em;
        color: rgba(178, 195, 245, 0.66);
      }

      #relayout {
        position: fixed;
        right: 20px;
        bottom: 18px;
        padding: 7px 14px;
        font: inherit;
        font-size: 12px;
        color: var(--dim);
        background: rgba(8, 10, 26, 0.55);
        border: 1px solid rgba(150, 170, 255, 0.16);
        border-radius: 999px;
        backdrop-filter: blur(8px);
        cursor: pointer;
      }
      #relayout:hover {
        color: var(--ink);
        border-color: rgba(150, 170, 255, 0.35);
      }

      #hint {
        position: fixed;
        bottom: 18px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 12px;
        color: var(--dim);
        pointer-events: none;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 13px;
        letter-spacing: 0.2em;
        color: var(--dim);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="space"></canvas>
    <div id="labels"></div>
    <div id="hud"></div>
    <button id="relayout" title="星団から並べ直す">再配置</button>
    <div id="loading">星を数えている…</div>
    <div id="hint">ドラッグで移動・ホイールで拡大縮小（回転はしない）</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
